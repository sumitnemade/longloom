name: Release

# Pushing a version tag (v1.2.3) builds the package and publishes it to PyPI
# via Trusted Publishing (OIDC) — no API tokens stored in the repository.
#
# One-time setup on pypi.org:
#   Project → Publishing → Add a new pending publisher
#     owner: <github-owner>   repository: longloom
#     workflow: release.yml   environment: pypi

on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    name: build + publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write      # OIDC — required for trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Metadata pre-flight
        run: twine check dist/*

      - name: Sanity — version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import longloom; print(longloom.__version__)")
          test "$TAG" = "$PKG" || { echo "tag v$TAG != package $PKG"; exit 1; }

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Attach artifacts to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true