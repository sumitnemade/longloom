name: Release

# Pushing a version tag (v1.2.3) builds the package and publishes it to PyPI
# via Trusted Publishing (OIDC) — no API tokens stored in the repository.
#
# One-time setup on pypi.org:
#   Project → Publishing → Add a new pending publisher
#     owner: <github-owner>   repository: longloom
#     workflow: release.yml   environment: pypi

on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    name: build + publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write      # OIDC — required for trusted publishing
      contents: write      # required to create the GitHub Release with artifacts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Metadata pre-flight
        run: twine check dist/*

      - name: Sanity — version matches tag (regex, no package import)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' longloom/__init__.py)
          test "$TAG" = "$PKG" || { echo "tag v$TAG != package $PKG"; exit 1; }

      - name: Skip if this version is already on PyPI (idempotent re-runs)
        id: published
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if curl -fsSL --max-time 15 "https://pypi.org/pypi/longloom/$VERSION/json" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "version $VERSION is already on PyPI — skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI
        if: steps.published.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Attach artifacts to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true